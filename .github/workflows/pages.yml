name: Deploy to GitHub Pages
on:
  # Every branch runs the tests; only the default branch deploys (the deploy job's `if`),
  # so renaming the default branch never needs an edit here.
  push:
    branches: ["**"]
  workflow_dispatch:
  # Hourly: refresh the News app (everything else is cached, so this is quick).
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
# A newer run waits for the one in progress instead of cancelling it, so the hourly news refresh can
# never kill a long deploy (e.g. one re-recording every audio clip after the cache is lost).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
  deploy:
    needs: test
    # Scheduled runs always use the default branch; pushes and manual runs deploy only from it.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Recorded clips for 🔊 (the iPhone mutes its built-in voice on silent, but plays audio files).
      - name: List clips to record
        run: node scripts/audio-jobs.mjs
      - name: Restore previously recorded clips
        uses: actions/cache@v4
        with:
          path: audio/*/*.mp3
          key: audio-v1-${{ hashFiles('audio-jobs.json') }}
          restore-keys: audio-v1-
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Record new clips (Microsoft neural voices via edge-tts)
        # Never blocks a deploy: missing clips fall back to the device voice in the app.
        continue-on-error: true
        timeout-minutes: 30
        run: pip install --quiet "edge-tts>=6.1,<8" && python scripts/gen_audio.py audio-jobs.json
      # Offline dictionaries (Korean, Cantonese, English): rebuilt weekly or when the converter changes.
      - name: Restore dictionaries
        uses: actions/cache@v4
        with:
          path: dict
          key: dict-v2-${{ hashFiles('scripts/build-dict.mjs') }}-${{ github.run_id }}
          restore-keys: dict-v2-${{ hashFiles('scripts/build-dict.mjs') }}-
      - name: Build dictionaries
        continue-on-error: true
        run: |
          fresh() { [ -s "$1" ] && [ -n "$(find "$1" -mtime -7)" ]; }
          fresh dict/ko.json || node scripts/build-dict.mjs ko
          if ! fresh dict/yue.json; then
            mkdir -p /tmp/canto && cd /tmp/canto
            curl -sSfL -o cedict_ts.u8.gz https://www.mdbg.net/chinese/export/cedict/cedict_1_0_ts_utf-8_mdbg.txt.gz && gunzip -f cedict_ts.u8.gz
            curl -sSfLO https://cantonese.org/cccanto-170202.zip && curl -sSfLO https://cantonese.org/cccedict-canto-readings-150923.zip
            unzip -oq '*.zip' && cd - && node scripts/build-dict.mjs yue /tmp/canto
          fi
          fresh dict/en.json || node scripts/build-dict.mjs en
          ls -la dict | tee dict/stats.txt
      - name: Collect news (free-to-read feeds, opinion removed)
        continue-on-error: true
        run: node scripts/build-news.mjs
      # Stocks: the last good feed comes back first, so a failed fetch leaves yesterday's ratings up, not none.
      - name: Restore the last stock feed and chart histories
        uses: actions/cache@v4
        with:
          path: |
            stocks/feed.json
            stocks/history
          key: stocks-v2-${{ github.run_id }}
          restore-keys: stocks-v2-
      - name: Rate the stocks (Yahoo prices; daily note by Claude Haiku when the ANTHROPIC_API_KEY secret is set)
        continue-on-error: true
        timeout-minutes: 15
        env:
          NOTE_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # node_modules must never reach the published site: the whole folder is uploaded below.
        # A failed install costs only the note; the ratings still build. The key goes to node alone.
        run: |
          trap 'rm -rf node_modules' EXIT
          if [ -n "$NOTE_KEY" ]; then
            npm install --ignore-scripts --no-package-lock --no-audit --no-fund || echo "::warning::Claude SDK not installed: ratings build without today's note"
          fi
          ANTHROPIC_API_KEY="$NOTE_KEY" node scripts/build-stocks.mjs
      - name: Stamp service-worker cache version with the commit SHA
        run: sed -i "s/const VERSION = \"dev\";/const VERSION = \"${GITHUB_SHA::12}\";/" sw.js && grep -q "${GITHUB_SHA::12}" sw.js
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Dictionary sizes (for the log tail)
        if: always()
        run: |
          cat dict/stats.txt 2>/dev/null || true
          for f in dict/*.json; do echo "$f -> $(grep -c '^\[' "$f") entries"; done
          node -e 'const f=JSON.parse(require("fs").readFileSync("news/feed.json"));const by={};for(const s of f.stories)for(const t of s.topics.concat(s.lang,s.geo||[]))by[t]=(by[t]||0)+1;console.log("news:",f.stories.length,"stories",JSON.stringify(by));console.log("feeds down:",f.sources.filter(s=>!s.ok).map(s=>s.id).join(" ")||"none")' || true
