<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stocks</title>
<!-- Unlisted: personal research, kept out of search engines and off the home page. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f141b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stocks">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="../icons/stocks-180.png">
<link rel="icon" href="../icons/stocks.svg" type="image/svg+xml">
<link rel="stylesheet" href="./stocks.css">
</head>
<body>
<!-- Shared fills for the charts' shaded areas (one set, so every chart can use them). -->
<svg class="defs" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="fill-up" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="up"/><stop offset="1" class="up end"/></linearGradient>
  <linearGradient id="fill-down" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="down"/><stop offset="1" class="down end"/></linearGradient>
  <linearGradient id="fill-US" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="ln-US"/><stop offset="1" class="ln-US end"/></linearGradient>
  <linearGradient id="fill-HK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="ln-HK"/><stop offset="1" class="ln-HK end"/></linearGradient>
  <linearGradient id="fill-UK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="ln-UK"/><stop offset="1" class="ln-UK end"/></linearGradient>
</defs></svg>
<header class="mast">
  <div class="mast-row">
    <h1>Stocks</h1>
    <button class="icon-btn" id="refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4.5v4.8h-4.8"/></svg></button>
    <button class="icon-btn" id="learn" data-tab="learn" aria-label="Learn: words, scorecard and method"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 2-2h12v14.5H7a2 2 0 0 0-2 2z"/><path d="M5 19.5a2 2 0 0 0 2 2h12v-4"/></svg></button>
  </div>
  <div class="dateline" id="dateline"></div>
  <nav class="chips" id="chips" aria-label="Market"></nav>
</header>
<main id="main" class="main"></main>
<footer class="foot">Personal research from fixed rules on past prices. Not financial advice.</footer>
<nav class="tabbar" id="tabs" aria-label="Sections"></nav>
<dialog id="sheet" class="sheet"></dialog>
<script type="module" src="./stocks.js"></script>
</body>
</html>
